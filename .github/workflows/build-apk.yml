name: Build Battleworth APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Unpack project
        run: |
          test -f Battleworth_Project.zip
          test -f Battleworth_Assets.zip
          mkdir -p buildsrc
          unzip -q Battleworth_Project.zip -d buildsrc
          unzip -q Battleworth_Assets.zip -d buildsrc

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare Android
        working-directory: buildsrc
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 apply_android_mobile_patch.py
          npx cap sync android
          python3 apply_android_mobile_patch.py

      - name: Build APK
        working-directory: buildsrc/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK
        run: |
          cp buildsrc/android/app/build/outputs/apk/debug/app-debug.apk Battleworth-debug.apk
          sha256sum Battleworth-debug.apk > Battleworth-debug.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Battleworth-debug-apk
          path: |
            Battleworth-debug.apk
            Battleworth-debug.sha256
          retention-days: 14
