name: Build Battleworth APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unpack Battleworth
        shell: bash
        run: |
          test -f Battleworth_Project.zip
          test -f Battleworth_Assets.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Battleworth_Project.zip -d buildsrc
          unzip -q Battleworth_Assets.zip -d buildsrc

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@
